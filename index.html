<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio académico · Flores Canto, David Piero</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ef;--card:#fff;--ink:#202522;--mut:#69736d;--line:#d8dfd8;--pri:#087f73;--navy:#244b47;--soft:#e4efeb;--btn:#173e3a;--btnt:#fff;--ok:#23835e;--accent:#c45b38}
@media(prefers-color-scheme:dark){:root{--bg:#171d1b;--card:#202925;--ink:#edf1ed;--mut:#a4b0a8;--line:#3a4740;--pri:#59c2ad;--navy:#a9d8ce;--soft:#293932;--btn:#9bdbc9;--btnt:#14201c;--ok:#64c99d;--accent:#f08b67}}
*{box-sizing:border-box}
html{scroll-padding-top:84px;scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--line) .65px,transparent .65px);background-size:18px 18px;color:var(--ink);font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0;line-height:1.15}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px max(20px,4vw);border-bottom:1px solid var(--line);background:var(--card)}
header .t{flex:1;min-width:0}
header .t b{font:600 19px 'Source Serif 4',Georgia,serif;display:block}
header .t span{color:var(--mut);font-size:14px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:2px;transition:background-color .16s ease,border-color .16s ease,color .16s ease}
button:hover,.btn:hover{border-color:var(--pri)}
button.p,.btn.p{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--pri);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
.hero{background:linear-gradient(112deg,var(--card) 72%,var(--soft));border:1px solid var(--line);border-left:4px solid var(--pri);display:grid;grid-template-columns:auto 1fr auto;gap:32px;padding:36px;box-shadow:0 12px 34px rgba(24,50,42,.06)}
.hero.public-hero{grid-template-columns:minmax(0,1fr) 180px;align-items:center;min-height:290px}
.public-hero .ph{width:180px}
.public-hero .ph .box{width:160px;height:200px;margin:0 auto}
.public-hero .eyebrow{letter-spacing:.08em}
.public-section{margin-top:42px}
.public-section h2{font-size:30px;margin-bottom:8px}
.public-lead{color:var(--mut);margin:0 0 20px}
.public-empty{padding:22px;background:var(--card);border:1px dashed var(--line);color:var(--mut)}
.public-footer{border-top:1px solid var(--line);margin-top:44px;padding-top:18px;color:var(--mut);font-size:13px}
.hero h1{font-size:clamp(28px,5vw,46px);margin:6px 0 14px}
.hero p{color:var(--mut);margin:0 0 22px;max-width:60ch}
.hero p b{color:var(--ink)}
.eyebrow{color:var(--pri);font-size:13px;text-transform:uppercase}
.stats{display:flex;gap:30px;flex-wrap:wrap}
.stats b{display:block;font:500 28px 'IBM Plex Mono',monospace;color:var(--navy)}
.stats span{color:var(--mut);font-size:14px}
.badge{display:grid;gap:6px;justify-items:center;align-content:start;width:110px;color:var(--mut);font-size:12px;border-right:1px solid var(--line);padding-right:32px}
.ph{width:140px;text-align:center;font-size:12px;color:var(--mut)}
.ph .box{width:140px;height:175px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font:600 40px 'Source Serif 4',serif;color:var(--navy);overflow:hidden;margin-bottom:8px}
.ph .box img{width:100%;height:100%;object-fit:cover}
.ph label{cursor:pointer;color:var(--pri);text-decoration:underline}
.tabs{display:flex;gap:0;margin:34px 0 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:12px 18px;color:var(--mut);border-radius:0}
.tabs button{flex:0 0 auto}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--pri);font-weight:600}
.units{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.units button[aria-selected=true]{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.wk{background:var(--card);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 12px rgba(24,50,42,.035)}
.wk.has{border-left:4px solid var(--ok)}
.wk h3{font-size:19px;display:flex;justify-content:space-between;align-items:baseline}
.wk h3 small{font:400 12px 'IBM Plex Mono',monospace;color:var(--mut)}
.week-details{display:grid;gap:6px}
.week-title{font-size:16px}
.week-link{color:var(--pri);font-size:14px;overflow-wrap:anywhere}
.week-meta{display:grid;gap:8px}
.week-meta label{display:grid;gap:4px;color:var(--mut);font-size:13px}
.week-meta button{justify-self:start}
.drop{display:block;border:1.5px dashed var(--line);padding:18px 10px;text-align:center;color:var(--mut);font-size:14px;cursor:pointer}
.drop.over{border-color:var(--pri);background:var(--soft);color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.th{position:relative;aspect-ratio:1;background:var(--soft)}
.th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.th.document{aspect-ratio:auto;min-height:110px;display:flex;align-items:center;padding:12px;overflow-wrap:anywhere}
.th.document a{color:var(--pri);font-size:14px}
.th.document small{display:block;color:var(--mut)}
.th i{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.65);color:#fff;font:11px 'IBM Plex Mono',monospace;padding:0 5px}
.th button{position:absolute;right:3px;top:3px;padding:0 7px;line-height:20px;background:rgba(0,0,0,.65);color:#fff;border:0}
.nx{align-self:flex-end;font-size:14px}
.skills{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.skills h2{font-size:26px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);color:var(--navy);padding:5px 8px 5px 12px;font:500 14px 'IBM Plex Mono',monospace;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip button{border:0;background:none;padding:0 3px;color:var(--mut);font-size:18px;line-height:1}
.chip button:hover{color:var(--accent)}
.add{display:flex;gap:8px;margin-top:14px}
input[type=text],input[type=password],input[type=url]{font:inherit;padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;width:100%}
.note{color:var(--mut);font-size:13px;margin-top:40px;max-width:70ch}
.auth{max-width:400px;margin:9vh auto;background:var(--card);border:1px solid var(--line);padding:32px;display:grid;gap:14px}
.auth h1{font-size:28px}.err{color:#c0392b;font-size:14px;min-height:20px}
.auth a{color:var(--pri);font-size:14px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:9;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:94vw;max-height:92vh}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 18px;display:none;z-index:10}
.chat-toggle{position:fixed;right:20px;bottom:20px;z-index:11;border:0;border-radius:999px;background:var(--btn);color:var(--btnt);box-shadow:0 4px 18px #0003}
.chat-panel{position:fixed;right:20px;bottom:82px;z-index:11;width:min(360px,calc(100vw - 28px));height:min(460px,calc(100dvh - 110px));background:var(--card);border:1px solid var(--line);box-shadow:0 8px 30px #0003;display:flex;flex-direction:column}
.chat-panel[hidden]{display:none}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.chat-head strong{flex:1}
.chat-head small{display:block;color:var(--mut);font-size:12px}
.chat-close{padding:2px 9px;font-size:20px}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px}
.chat-message{max-width:90%;padding:9px 11px;background:var(--soft);overflow-wrap:anywhere}
.chat-message.user{align-self:flex-end;background:var(--btn);color:var(--btnt)}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-form input{min-width:0}
.chat-form button{flex:0 0 auto}
@media(max-width:760px){main{padding:22px 14px 44px}.hero,.hero.public-hero{grid-template-columns:1fr;gap:20px;padding:22px}.badge{display:none}.ph{order:-1}.ph .box{margin:0 auto 8px}.public-hero .ph{order:-1;width:100%}.stats{gap:16px}.units{overflow-x:auto;flex-wrap:nowrap;padding:2px}.units button{flex:0 0 auto}.weeks{grid-template-columns:1fr}.add{align-items:stretch}.add input{min-width:0}}
@media(max-width:420px){header{gap:10px;padding:10px 12px}header svg{width:30px;height:30px}header .t b{font-size:16px}header .t span{font-size:12px}header button{padding:7px 9px;font-size:14px}.hero h1{overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats b{font-size:23px}.stats span{font-size:12px}.tabs button{padding:11px 12px;font-size:14px}.add{gap:6px}.add button{padding:8px 10px}.chat-toggle{right:12px;bottom:12px}.chat-panel{right:12px;bottom:70px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="lb"><img alt="Vista ampliada"></div>
<div id="msg" role="status"></div>
<section class="chat-panel" id="chat-panel" aria-label="Ayuda del portafolio" hidden>
 <div class="chat-head"><div><strong>Ayuda del portafolio</strong><small>Respuestas sobre este sistema</small></div><button class="chat-close" id="chat-close" type="button" aria-label="Cerrar chat">×</button></div>
 <div class="chat-messages" id="chat-messages" aria-live="polite"><div class="chat-message">¡Hola! Puedo ayudarte con cursos, semanas, imágenes, títulos, enlaces y otras funciones del portafolio.</div></div>
 <form class="chat-form" id="chat-form"><input type="text" id="chat-input" placeholder="Pregunta sobre el portafolio..." aria-label="Escribe tu pregunta" autocomplete="off" required><button class="p" type="submit">Enviar</button></form>
</section>
<button class="chat-toggle" id="chat-toggle" type="button" aria-expanded="false" aria-controls="chat-panel">💬 Ayuda</button>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COURSES=['Taller de Aplicaciones 1','Algoritmo y Estructura de Datos'];
const DEFAULT_SKILLS=['Python','Java','JavaScript','HTML y CSS','Git y GitHub','SQL','Lógica de programación','Estructuras de datos','Algoritmos','Trabajo en equipo'];
const S={c:0,u:0,imgs:[],photo:null,user:null,weekDetails:{}};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

/* ---------- Base de datos local (IndexedDB) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('portafolio-upla',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('imgs',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('kv')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,mode,fn)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};

async function load(){
 S.weekDetails=lsGet('weekDetails',{});
 const all=await tx('imgs','readonly',s=>s.getAll());
 all.sort((a,b)=>a.id-b.id);
 S.imgs=all.map(r=>({...r,kind:r.kind||fileKind({name:r.name,type:r.blob.type})||'image',url:URL.createObjectURL(r.blob)}));
 const p=await tx('kv','readonly',s=>s.get('photo'));
 S.photo=p?URL.createObjectURL(p):null;
}

/* ---------- Utilidades ---------- */
const hash=async p=>{if(!crypto.subtle)return btoa(p);
 const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('upla:'+p));
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
async function shrink(f,max=1600){
 const bm=await createImageBitmap(f);const k=Math.min(1,max/Math.max(bm.width,bm.height));
 const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
 c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('No se pudo procesar la imagen')),'image/jpeg',.82))}
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',2600)};
const slotImgs=s=>S.imgs.filter(i=>i.slot===s);
const fileKind=f=>{
 const name=f.name.toLocaleLowerCase();
 if(f.type.startsWith('image/')||(!f.type&&/\.(avif|bmp|gif|jpe?g|png|webp)$/.test(name)))return 'image';
 if(f.type==='application/pdf'||name.endsWith('.pdf'))return 'pdf';
 if(f.type==='application/msword'||f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'||/\.(doc|docx)$/.test(name))return 'word';
 return null;
};
const safeLink=value=>{try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:null}catch{return null}};
function chatReply(question){
 const q=question.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 if(/\b(hola|buenas|buenos dias|buenas tardes)\b/.test(q))return '¡Hola! Puedo responder preguntas sobre cómo usar este portafolio académico.';
 if(/titulo|nombre|enlace|link/.test(q))return 'En administración, cada semana tiene campos opcionales para título y enlace. Escribe lo que quieras y pulsa “Guardar”; el enlace debe empezar con http:// o https://.';
 if(/imagen|foto|subir|cargar|archivo|pdf|word/.test(q))return 'En administración, abre el curso y la unidad; en la semana elegida puedes arrastrar o seleccionar imágenes, PDF y archivos Word (.doc o .docx). La foto del perfil se cambia desde “Cambiar foto”.';
 if(/semana|unidad|curso|tarea|trabajo/.test(q))return 'El portafolio organiza los trabajos por curso, unidad y semana. Usa las pestañas de cursos y los botones de unidad para navegar. Las semanas con trabajos, título o enlace aparecen en la vista pública.';
 if(/habilidad/.test(q))return 'En administración, puedes agregar habilidades desde el campo “Agregar habilidad” y quitarlas con el botón × junto a cada una.';
 if(/guardar|datos|privacidad|navegador|dispositivo/.test(q))return 'Las imágenes, los PDF, los archivos Word y la foto se guardan en IndexedDB de este navegador; los títulos, enlaces y habilidades se guardan en el almacenamiento local. No se sincronizan con otros dispositivos.';
 if(/admin|administrar|contrasena|sesion|entrar/.test(q))return 'Para administrar, pulsa “Administrar” en el portafolio público e inicia sesión. Desde esa vista puedes editar el contenido y cerrar sesión.';
 if(/portafolio|sistema|funciona|funcion/.test(q))return 'Este sistema muestra un portafolio académico con cursos, unidades, semanas, trabajos, habilidades y foto de perfil. Pregúntame por cualquiera de esas funciones.';
 return 'Solo puedo ayudar con el uso de este portafolio académico. Pregúntame sobre cursos, semanas, imágenes, títulos, enlaces, habilidades o administración.';
}
const doneWeeks=c=>{let n=0;for(let u=0;u<4;u++)for(let w=0;w<4;w++){const slot=`${c}-${u}-${w}`;if(slotImgs(slot).length||S.weekDetails[slot]?.title||S.weekDetails[slot]?.link)n++}return n};
const initials=n=>n.split(/[ ,]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();

/* ---------- Subida múltiple ---------- */
async function addFiles(slot,files){
 const selected=[...files].map(file=>({file,kind:fileKind(file)}));
 const fs=selected.filter(x=>x.kind).sort((a,b)=>a.file.name.localeCompare(b.file.name,undefined,{numeric:true}));
 if(selected.some(x=>!x.kind))toast('Solo se admiten imágenes, PDF y archivos Word (.doc o .docx).');
 if(!fs.length)return;
 let n=0;
 for(const {file,kind} of fs){
  toast(`Guardando ${++n} de ${fs.length}…`);
  try{
   const blob=kind==='image'?await shrink(file):file;
   const rec={slot,name:file.name,kind,blob};
   rec.id=await tx('imgs','readwrite',s=>s.add(rec));
   S.imgs.push({...rec,url:URL.createObjectURL(blob)});
  }catch(error){
   console.error(`No se pudo guardar ${file.name}`,error);
   toast(`No se pudo guardar ${file.name}. Revisa el espacio disponible en el navegador.`);
   view();return;
  }
 }
 const skipped=selected.length-fs.length;
 toast(`${fs.length} archivo(s) guardados${skipped?`; ${skipped} no admitido(s)`:''}`);view();
}
async function delImage(id){
 await tx('imgs','readwrite',s=>s.delete(id));
 const i=S.imgs.findIndex(x=>x.id===id);if(i>=0){URL.revokeObjectURL(S.imgs[i].url);S.imgs.splice(i,1)}
 view();
}

/* ---------- Vistas ---------- */
function authView(){
 const u=lsGet('user',null);
 $('#app').innerHTML=`<form class="auth" id="af">
  <p class="eyebrow mono">${u?'Iniciar sesión':'Crear cuenta'}</p>
  <h1>Portafolio académico</h1>
  ${u?`<p style="margin:0;color:var(--mut)">Hola, ${esc(u.name)}.</p>`:`<input type="text" id="nm" value="Flores Canto, David Piero" aria-label="Nombre completo" required>`}
  <input type="password" id="pw" placeholder="Contraseña" aria-label="Contraseña" required minlength="4">
  <div class="err" id="er"></div>
  <button class="p" type="submit">${u?'Entrar':'Crear cuenta y entrar'}</button>
  <a href="./">Volver al portafolio público</a>
 </form>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;const h=await hash(pw);
  if(u){if(h!==u.h)return $('#er').textContent='Contraseña incorrecta. Inténtalo de nuevo.'}
  else lsSet('user',{name:$('#nm').value.trim(),h});
  sessionStorage.setItem('ok','1');history.replaceState(null,'',`${location.pathname}?admin=1`);start(false)};
}
function view(publicMode=false){
 const u=lsGet('user',{name:'Estudiante'});const c=S.c;
 const done=doneWeeks(c);
 const weekIndexes=[0,1,2,3].filter(w=>{
  const slot=`${c}-${S.u}-${w}`;const detail=S.weekDetails[slot];
  return !publicMode||slotImgs(slot).length||detail?.title||detail?.link;
 });
 const weeks=weekIndexes.map(w=>{const slot=`${c}-${S.u}-${w}`;const im=slotImgs(slot);
  const detail=S.weekDetails[slot]||{title:'',link:''};const link=safeLink(detail.link||'');
  return `<section class="wk ${im.length?'has':''}" id="w${w}">
   <h3>Semana ${w+1}<small>${im.length} ${im.length===1?'archivo':'archivos'}</small></h3>
   ${detail.title||link?`<div class="week-details">${detail.title?`<h4 class="week-title">${esc(detail.title)}</h4>`:''}${link?`<a class="week-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Ver enlace ↗</a>`:''}</div>`:''}
   ${publicMode?'':`<form class="week-meta" data-slot="${slot}">
    <label>Título (opcional)<input type="text" name="title" value="${esc(detail.title||'')}" placeholder="Título de la semana"></label>
    <label>Enlace (opcional)<input type="url" name="link" value="${esc(detail.link||'')}" placeholder="https://..."></label>
    <button class="p">Guardar</button>
   </form>`}
   ${publicMode?'':`<label class="drop" data-slot="${slot}"><input type="file" accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple data-slot="${slot}">Arrastra imágenes, PDF o Word aquí, o toca para elegirlos<br>(puedes seleccionar varios archivos)</label>`}
   <div class="thumbs">${im.map((x,i)=>`<div class="th ${x.kind==='image'?'':'document'}">${x.kind==='image'?`<img src="${x.url}" alt="${esc(x.name)}" data-big="${x.url}">`:`<a href="${x.url}" download="${esc(x.name)}">${esc(x.name)}<small>Descargar ${x.kind==='pdf'?'PDF':'Word'}</small></a>`}<i>${i+1}</i>${publicMode?'':`<button data-del="${x.id}" aria-label="Eliminar ${esc(x.name)}">×</button>`}</div>`).join('')}</div>
   ${!publicMode&&w<3?`<button class="nx" data-next="${w+1}">Siguiente semana →</button>`:''}
  </section>`}).join('');
 const skills=lsGet('skills',DEFAULT_SKILLS);
 $('#app').innerHTML=`
 <header>
  <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2l14 8v16l-14 8L4 26V10z" fill="var(--pri)"/><text x="18" y="23" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="sans-serif">UP</text></svg>
  <div class="t"><b>${esc(u.name)}</b><span>Universidad Peruana Los Andes</span></div>
  <a class="btn ${publicMode?'p':''}" href="${publicMode?'?admin=1':'./'}">${publicMode?'Administrar':'Ver portafolio'}</a>
  ${publicMode?'':'<button id="out">Cerrar sesión</button>'}
 </header>
 <main>
  <div class="hero ${publicMode?'public-hero':''}">
   ${publicMode?'':'<div class="badge mono"><span>Universidad</span><span>Peruana</span><span>Los Andes</span></div>'}
   <div>
    <p class="eyebrow mono" style="margin:0">${publicMode?'Portafolio académico':'Expediente de curso'}</p>
    <h1>${publicMode?'Hola, soy ':''}${esc(u.name)}</h1>
    <p>${publicMode?'Aquí comparto mis trabajos, habilidades y proyectos de la Universidad Peruana Los Andes.':`Registro de las tareas entregadas en <b>${COURSES[0]}</b> y <b>${COURSES[1]}</b>, organizadas por unidad y semana en el mismo orden en que se dictaron en clase.`}</p>
    <div class="stats"><div><b>02</b><span>Cursos</span></div><div><b>04</b><span>Unidades por curso</span></div><div><b>${done}/16</b><span>Semanas con tareas</span></div></div>
   </div>
   <div class="ph"><div class="box">${S.photo?`<img src="${S.photo}" alt="Foto de ${esc(u.name)}">`:esc(initials(u.name))}</div>${publicMode?'':'<label>Cambiar foto<input type="file" accept="image/*" id="pf" hidden></label>'}</div>
  </div>
  <section class="public-section" id="trabajos">
  ${publicMode?'<h2>Trabajos seleccionados</h2><p class="public-lead">Explora las entregas por curso y unidad.</p>':''}
  <div class="tabs" role="tablist">${COURSES.map((n,i)=>`<button role="tab" aria-selected="${i===c}" data-c="${i}">${n}</button>`).join('')}</div>
  <div class="units">${[0,1,2,3].map(i=>`<button aria-selected="${i===S.u}" data-u="${i}">Unidad ${i+1}</button>`).join('')}</div>
  <div class="weeks">${weeks|| (publicMode?'<p class="public-empty">Aún no hay trabajos en esta unidad.</p>':'')}</div>
  </section>
  <div class="skills">
   <h2>Habilidades</h2>
   <div class="chips">${skills.map((s,i)=>`<span class="chip">${esc(s)}${publicMode?'':`<button data-rs="${i}" aria-label="Quitar ${esc(s)}">×</button>`}</span>`).join('')}</div>
   ${publicMode?'':'<form class="add" id="sf"><input type="text" id="sk" placeholder="Agregar habilidad" aria-label="Nueva habilidad"><button class="p">Agregar</button></form>'}
  </div>
  ${publicMode?'<p class="public-footer">Portafolio académico · Universidad Peruana Los Andes</p>':'<p class="note">Tus imágenes, documentos y los títulos y enlaces de cada semana se guardan en este navegador. Si borras los datos del navegador o cambias de dispositivo, no los verás: conserva una copia de tus archivos originales.</p>'}
 </main>`;
}

/* ---------- Eventos ---------- */
const app=$('#app');
const chatPanel=$('#chat-panel'),chatToggle=$('#chat-toggle'),chatMessages=$('#chat-messages');
function setChatOpen(open){chatPanel.hidden=!open;chatToggle.setAttribute('aria-expanded',String(open));if(open)$('#chat-input').focus()}
function addChatMessage(text,kind){
 const message=document.createElement('div');message.className=`chat-message ${kind}`.trim();message.textContent=text;chatMessages.append(message);chatMessages.scrollTop=chatMessages.scrollHeight;
}
chatToggle.addEventListener('click',()=>setChatOpen(chatPanel.hidden));
$('#chat-close').addEventListener('click',()=>setChatOpen(false));
$('#chat-form').addEventListener('submit',e=>{
 e.preventDefault();const input=$('#chat-input');const question=input.value.trim();if(!question)return;
 addChatMessage(question,'user');addChatMessage(chatReply(question),'');input.value='';input.focus();
});
app.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.c){S.c=+t.dataset.c;S.u=0;view()}
 else if(t.dataset.u){S.u=+t.dataset.u;view()}
 else if(t.dataset.del){if(confirm('¿Eliminar esta imagen?'))delImage(+t.dataset.del)}
 else if(t.dataset.big){$('#lb img').src=t.dataset.big;$('#lb').classList.add('on')}
 else if(t.dataset.next){$('#w'+t.dataset.next).scrollIntoView({behavior:'smooth'})}
 else if(t.dataset.rs!==undefined){const s=lsGet('skills',DEFAULT_SKILLS);s.splice(+t.dataset.rs,1);lsSet('skills',s);view()}
 else if(t.id==='out'){sessionStorage.clear();history.replaceState(null,'',location.pathname);start(true)}});
app.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.slot){await addFiles(t.dataset.slot,t.files);t.value=''}
 else if(t.id==='pf'&&t.files[0]){
  try{const b=await shrink(t.files[0],600);await tx('kv','readwrite',s=>s.put(b,'photo'));if(S.photo)URL.revokeObjectURL(S.photo);S.photo=URL.createObjectURL(b);view()}
  catch(error){console.error('No se pudo guardar la foto de perfil',error);toast('No se pudo guardar la foto. Revisa el formato y el espacio disponible.')}
  finally{t.value=''}
 }});
app.addEventListener('submit',e=>{
 if(e.target.matches('.week-meta')){
  e.preventDefault();const form=e.target;const title=form.elements.namedItem('title').value.trim();const link=form.elements.namedItem('link').value.trim();
  if(link&&!safeLink(link))return toast('El enlace debe comenzar con http:// o https://');
  const details={...S.weekDetails};
  if(title||link)details[form.dataset.slot]={title,link};
  else delete details[form.dataset.slot];
  try{localStorage.setItem('weekDetails',JSON.stringify(details))}
  catch(error){console.error('No se pudieron guardar los datos de la semana',error);return toast('No se pudieron guardar los datos de la semana')}
  S.weekDetails=details;view();
 }else if(e.target.id==='sf'){
  e.preventDefault();const v=$('#sk').value.trim();if(v){const s=lsGet('skills',DEFAULT_SKILLS);if(s.some(x=>x.toLocaleLowerCase()===v.toLocaleLowerCase()))return toast('Esa habilidad ya está en la lista');s.push(v);lsSet('skills',s);view()}
 }
});
['dragover','dragleave','drop'].forEach(ev=>app.addEventListener(ev,e=>{const d=e.target.closest('.drop');if(!d)return;e.preventDefault();
 d.classList.toggle('over',ev==='dragover');if(ev==='drop')addFiles(d.dataset.slot,e.dataTransfer.files)}));
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});

async function start(publicMode=false){await load();view(publicMode)}
const adminRequested=new URLSearchParams(location.search).has('admin');
if(adminRequested){sessionStorage.getItem('ok')?start(false):authView()}else start(true);
</script>
</body>
