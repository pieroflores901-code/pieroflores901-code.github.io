<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portafolio académico de David Piero Flores Canto, estudiante de Ingeniería de Sistemas y Computación en la Universidad Peruana Los Andes.">
<meta name="theme-color" content="#070b18">
<title>Portafolio académico · Flores Canto, David Piero</title>
<link rel="icon" type="image/png" href="upla-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b18;--card:rgba(15,22,42,.72);--solid:#0e1528;--ink:#e8edff;--mut:#8f9bbd;--line:rgba(140,160,255,.16);--line-strong:rgba(140,160,255,.32);--pri:#7c8cff;--pri-ink:#070b18;--accent:#5ee6f0;--soft:rgba(124,140,255,.1);--ok:#5ee6a8;--danger:#ff7a8a;--grad:linear-gradient(120deg,#7c8cff,#5ee6f0);--glow:0 0 24px rgba(94,230,240,.35);--shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.45);--shadow-lift:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(94,230,240,.28);--sheen:rgba(94,230,240,.13);--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html{scroll-padding-top:88px;scroll-behavior:smooth;background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 600px at 85% -10%,rgba(124,140,255,.2),transparent 60%),radial-gradient(900px 520px at -10% 30%,rgba(94,230,240,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.6 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Unbounded','Manrope',sans-serif;font-weight:500;margin:0;line-height:1.15;letter-spacing:-.02em}
h4{margin:0}
a{color:var(--accent)}
::selection{background:rgba(94,230,240,.3)}
button,.btn{font:600 15px 'Manrope',system-ui,sans-serif;cursor:pointer;border:1px solid var(--line-strong);background:var(--soft);color:var(--ink);padding:9px 16px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .2s ease,transform .12s var(--ease-out)}
button:hover,.btn:hover{border-color:var(--accent)}
button:active,.btn:active{transform:scale(.97)}
button.p,.btn.p{background:var(--grad);color:var(--pri-ink);border-color:transparent}
button.p:hover,.btn.p:hover{box-shadow:var(--glow)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Cabecera ---------- */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px max(20px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--line);background:rgba(7,11,24,.72);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.logo{display:block;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(30,136,214,.45))}
.auth .logo{width:48px;height:55px}
.foot-brand{display:inline-flex;align-items:center;gap:10px}
.foot-brand .logo{width:22px;height:25px;filter:none}
header .t{flex:1;min-width:0}
header .t b{font:500 15px 'Unbounded',sans-serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t span{color:var(--mut);font-size:13px}
header nav{display:flex;gap:4px}
header nav a{color:var(--mut);text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:8px}
header nav a:hover{color:var(--ink);background:var(--soft)}

main{max-width:1100px;margin:0 auto;padding:36px 20px 64px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(17,25,48,.9),rgba(9,14,30,.9));border:1px solid var(--line-strong);border-radius:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px;align-items:center;padding:56px 52px 60px}
.hero>*{position:relative}
/* Piso holográfico: una cuadrícula en perspectiva que avanza lentamente hacia el visitante */
.hero>.floor{position:absolute;z-index:-1;left:-40%;right:-40%;bottom:0;height:60%;overflow:hidden;transform:perspective(380px) rotateX(55deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 15%,transparent 95%);mask-image:linear-gradient(to top,#000 15%,transparent 95%);pointer-events:none}
.floor::before{content:"";position:absolute;inset:-56px 0 0;background-image:linear-gradient(rgba(124,140,255,.5) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(94,230,240,.4) 1.5px,transparent 1.5px);background-size:56px 56px;animation:drift 4s linear infinite}
@keyframes drift{to{transform:translateY(56px)}}
.kicker{display:inline-flex;align-items:center;gap:10px;margin:0 0 18px;padding:6px 14px 6px 10px;border:1px solid var(--line-strong);border-radius:99px;background:var(--soft);color:var(--ink);font-weight:600;font-size:13px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(94,230,240,.18),0 0 12px var(--accent)}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.08;letter-spacing:-.035em;margin:0 0 18px;max-width:16ch;background:linear-gradient(180deg,#fff 30%,#b8c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--mut);margin:0 0 32px;max-width:58ch;font-size:17px}
.hero .lead b{color:var(--ink);font-weight:600}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 28px;max-width:620px}
.prog div{display:grid;gap:8px}
.prog p{margin:0;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mut)}
.prog p b{color:var(--ink);font-weight:600}
.prog p span{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:rgba(124,140,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--grad);box-shadow:0 0 12px rgba(94,230,240,.6);transform-origin:left;animation:grow .9s var(--ease-out) .25s both}
.ph{position:relative;text-align:center;font-size:13px;color:var(--mut);perspective:800px}
.ph::before{content:"";position:absolute;left:50%;top:42%;width:260px;height:260px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(94,230,240,.28),rgba(124,140,255,.12) 45%,transparent 70%);filter:blur(10px);pointer-events:none}
/* Foto holográfica en capas: esquinas de visor al fondo, foto al frente; el giro con el puntero revela la profundidad */
.ph .box{position:relative;width:200px;aspect-ratio:4/5;margin:0 auto 14px;transform-style:preserve-3d;transition:transform .5s var(--ease-out)}
.ph .box::after{content:"";position:absolute;inset:-12px;transform:translateZ(-24px);--c:var(--accent);background:linear-gradient(var(--c),var(--c)) 0 0/26px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 26px,linear-gradient(var(--c),var(--c)) 100% 0/26px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 26px,linear-gradient(var(--c),var(--c)) 0 100%/26px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 26px,linear-gradient(var(--c),var(--c)) 100% 100%/26px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 26px;background-repeat:no-repeat;filter:drop-shadow(0 0 6px rgba(94,230,240,.7))}
.ph .face{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1a2550,#0d1430);border:1px solid var(--line-strong);display:grid;place-items:center;font:500 54px 'Unbounded',sans-serif;color:var(--accent);box-shadow:var(--shadow-lift);transform:translateZ(28px)}
.ph .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(94,230,240,.14),transparent 45%)}
.ph .face img{width:100%;height:100%;object-fit:cover}
.ph label{cursor:pointer;color:var(--accent);font-weight:600}
.ph label:hover{text-decoration:underline}
@media(prefers-reduced-motion:no-preference){.hero .kicker,.hero h1,.hero .lead,.prog,.ph{animation:rise .7s var(--ease-out) both}.hero h1{animation-delay:.06s}.hero .lead{animation-delay:.12s}.prog{animation-delay:.18s}.ph{animation-delay:.1s}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes grow{from{transform:scaleX(0)}}

/* ---------- Secciones ---------- */
.section{margin-top:72px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.section-head h2{font-size:clamp(24px,3vw,32px)}
.section-head p{color:var(--mut);margin:8px 0 0;max-width:60ch}

/* ---------- Trabajos ---------- */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--mut);border-radius:10px;padding:10px 18px}
.tabs button[aria-selected=true]{background:var(--solid);color:var(--ink);border-color:var(--line-strong);box-shadow:0 0 18px rgba(124,140,255,.18)}
.units{display:flex;gap:8px;margin:18px 0 24px;flex-wrap:wrap}
.units button{border-radius:99px;padding:7px 16px;font-size:14px;background:transparent}
.units button[aria-selected=true]{background:var(--grad);color:var(--pri-ink);border-color:transparent}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.wk,.skill-group{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px}
.wk{padding:20px;display:flex;flex-direction:column;gap:14px}
.wk.has{border-color:rgba(94,230,240,.3);box-shadow:var(--shadow)}
.wk h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wk h3 small{font:600 12px 'Manrope',sans-serif;letter-spacing:0;color:var(--mut);background:var(--soft);padding:3px 10px;border-radius:99px;white-space:nowrap}
.wk.has h3 small{color:var(--ok);background:rgba(94,230,168,.12)}
.week-details{display:grid;gap:6px}
.week-title{font:600 16px 'Manrope',sans-serif}
.week-link{font-weight:600;font-size:14px;overflow-wrap:anywhere;text-underline-offset:3px}
.week-meta{display:grid;gap:10px}
.week-meta label{display:grid;gap:5px;color:var(--mut);font-size:13px;font-weight:600}
.week-meta small{font-weight:500;font-size:12px}
.week-meta button{justify-self:start}
.drop{display:block;border:1.5px dashed var(--line-strong);border-radius:12px;padding:18px 12px;text-align:center;color:var(--mut);font-size:14px;cursor:pointer;transition:border-color .16s ease,background-color .16s ease,color .16s ease}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(94,230,240,.06);color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs:empty{display:none}
.th{position:relative;aspect-ratio:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;transition:transform .3s var(--ease-out)}
@media(hover:hover) and (pointer:fine){.th img:hover{transform:scale(1.04)}}
.th.document{grid-column:1/-1;aspect-ratio:auto;display:flex;align-items:center;padding:12px 12px 12px 40px;overflow-wrap:anywhere}
.th.document a{font-size:14px;font-weight:600;text-decoration:none;color:var(--ink)}
.th.document small{display:block;color:var(--accent);font-weight:600}
.th i{position:absolute;left:6px;top:6px;background:rgba(7,11,24,.8);color:#fff;font:600 11px 'Manrope',sans-serif;font-style:normal;padding:1px 7px;border-radius:99px}
.th.document i{top:50%;transform:translateY(-50%)}
.th button{position:absolute;right:6px;top:6px;padding:0 8px;line-height:22px;background:rgba(7,11,24,.8);color:#fff;border:0;border-radius:99px}
.th button:hover{background:var(--danger)}
.nx{align-self:flex-end;font-size:14px}
/* Tarjetas en 3D: inclinación según el puntero con un brillo que lo sigue (solo en la vista pública y con mouse) */
.tilt{position:relative;transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out),border-color .3s ease}
.tilt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--sheen),transparent 45%);opacity:0;transition:opacity .3s ease}
.tilt.tilting{box-shadow:var(--shadow-lift);border-color:rgba(94,230,240,.4);transition:transform .12s linear,box-shadow .3s var(--ease-out),border-color .3s ease}
.tilt.tilting::before{opacity:1}
.public-empty{grid-column:1/-1;margin:0;padding:28px;background:var(--card);border:1.5px dashed var(--line-strong);border-radius:18px;color:var(--mut);text-align:center}

/* ---------- Habilidades ---------- */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.skill-group{padding:22px}
.skill-group h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.skill-group h3 svg{flex:0 0 auto;color:var(--accent);padding:7px;width:34px;height:34px;border-radius:10px;background:rgba(94,230,240,.1);border:1px solid rgba(94,230,240,.25)}
.skill-group ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;font-weight:600;font-size:15px}
.meter{display:flex;gap:4px}
.meter span,.meter button{width:18px;height:6px;border-radius:99px;background:rgba(124,140,255,.16);padding:0;border:0}
.meter .on{background:var(--accent);box-shadow:0 0 8px rgba(94,230,240,.55)}
.meter button:hover{background:var(--pri)}
.skill-x{border:0;background:none;padding:0 4px;color:var(--mut);font-size:20px;line-height:1}
.skill-x:hover{color:var(--danger)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-top:16px}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;margin-top:18px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
input[type=text],input[type=password],input[type=url],select{font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line-strong);background:var(--solid);color:var(--ink);border-radius:10px;width:100%}
input::placeholder{color:#64708f}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(94,230,240,.18)}
.note{color:var(--mut);font-size:14px;margin-top:48px;max-width:70ch;padding:14px 16px;border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0}
.publish{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,280px) auto;gap:10px 14px;align-items:center;padding:20px;background:var(--card);border:1px solid rgba(94,230,240,.35);border-radius:18px;box-shadow:var(--shadow)}
.publish h3{font-size:16px;margin-bottom:4px}
.publish p{margin:0;color:var(--mut);font-size:14px}
.publish small{grid-column:1/-1;color:var(--mut);font-size:13px}
.publish small b{color:var(--ink)}
.public-footer{border-top:1px solid var(--line);margin-top:72px;padding-top:20px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Acceso ---------- */
.auth{max-width:420px;margin:10vh auto;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-strong);border-radius:22px;box-shadow:var(--shadow);padding:36px;display:grid;gap:14px}
.auth h1{font-size:26px}
.auth button{justify-content:center}
.err{color:var(--danger);font-size:14px;min-height:20px}
.auth a{font-size:14px;font-weight:600}

/* ---------- Superposiciones ---------- */
#lb{position:fixed;inset:0;background:rgba(4,6,14,.92);display:none;place-items:center;z-index:9;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:94vw;max-height:92vh;border-radius:8px}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--solid);color:var(--ink);border:1px solid var(--line-strong);padding:11px 20px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:12;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
.chat-toggle{position:fixed;right:20px;bottom:20px;z-index:11;border:0;border-radius:99px;padding:6px 18px 6px 8px;gap:8px;background:var(--grad);color:var(--pri-ink);box-shadow:0 8px 24px rgba(0,0,0,.45),var(--glow)}
/* Rayas, el tigre del asistente: respira, parpadea, mueve las orejas, sigue el puntero con la mirada y habla al responder */
.tiger{display:block;overflow:visible}
.chat-toggle .tiger{width:40px;height:40px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.chat-head .tiger{width:46px;height:46px;flex:0 0 auto;padding:3px;border-radius:50%;background:rgba(7,11,24,.18)}
.t-ear,.t-eyes,.t-mouth{transform-box:fill-box}
.t-ear{transform-origin:50% 100%}
.t-eyes,.t-mouth{transform-origin:center}
.t-pupils{transition:transform .15s ease-out}
@media(prefers-reduced-motion:no-preference){
 .tiger{animation:bob 3.2s ease-in-out infinite}
 .t-eyes{animation:blinkEye 4.6s infinite}
 .t-ear-l{animation:twitch 5.5s infinite}
 .t-ear-r{animation:twitch 7s 1.3s infinite}
 .chat-toggle:hover .tiger{animation:hop .5s var(--ease-out)}
 .talking .t-mouth{animation:talk .16s ease-in-out infinite alternate}
}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes blinkEye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes twitch{0%,85%,100%{transform:rotate(0)}89%{transform:rotate(-16deg)}93%{transform:rotate(6deg)}}
@keyframes hop{40%{transform:translateY(-8px) rotate(8deg)}}
@keyframes talk{to{transform:scaleY(3.2)}}
.chat-skills{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;border-top:1px solid var(--line);scrollbar-width:none}
.chat-skills button{flex:0 0 auto;font-size:12px;padding:5px 10px;border-radius:99px}
.chat-panel{position:fixed;right:20px;bottom:82px;z-index:11;width:min(380px,calc(100vw - 28px));height:min(560px,calc(100dvh - 110px));background:rgba(10,15,32,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-strong);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right}
.chat-panel[hidden]{display:none}
@media(prefers-reduced-motion:no-preference){.chat-panel:not([hidden]){animation:pop .18s var(--ease-out)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--grad);color:var(--pri-ink)}
.chat-head>div{flex:1}
.chat-head strong{font:500 16px 'Unbounded',sans-serif}
.chat-head small{display:block;opacity:.75;font-size:12px;font-weight:600}
.chat-close{padding:0 10px;font-size:22px;background:none;border:0;color:inherit}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px}
.chat-message{max-width:88%;padding:10px 13px;background:var(--soft);border:1px solid var(--line);border-radius:14px 14px 14px 4px;overflow-wrap:anywhere;font-size:14px;white-space:pre-line}
.chat-message.user{align-self:flex-end;background:var(--grad);color:var(--pri-ink);border:0;border-radius:14px 14px 4px 14px;font-weight:600}
.chat-message.typing{display:flex;gap:4px;padding:14px 13px}
.chat-message.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.4}
@media(prefers-reduced-motion:no-preference){.chat-message.typing span{animation:blink 1s ease-in-out infinite}.chat-message.typing span:nth-child(2){animation-delay:.15s}.chat-message.typing span:nth-child(3){animation-delay:.3s}}
@keyframes blink{50%{opacity:1}}
.chat-suggest{display:flex;flex-wrap:wrap;gap:6px}
.chat-suggest button{font-size:13px;padding:6px 11px;border-radius:99px}
.chat-form{display:flex;gap:8px;padding:10px}
.chat-form input{min-width:0}
.chat-form button{flex:0 0 auto}

@media(max-width:860px){header nav{display:none}}
@media(max-width:760px){main{padding:22px 14px 48px}.hero{grid-template-columns:1fr;gap:30px;padding:30px 22px 40px}.ph{order:-1}.ph .box{width:160px}.ph::before{width:220px;height:220px}.section{margin-top:52px}.units{overflow-x:auto;flex-wrap:nowrap;padding:2px}.units button{flex:0 0 auto}.weeks{grid-template-columns:1fr}.publish{grid-template-columns:1fr}.add{grid-template-columns:1fr 1fr}.add input{grid-column:1/-1}.add button{grid-column:1/-1;justify-content:center}}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COURSES=['Taller de Aplicaciones 1','Algoritmo y Estructura de Datos'];

const SKILL_CATS=['Lenguajes','Desarrollo web','Datos y herramientas','Fundamentos','Habilidades blandas'];
const LEVELS=['','Básico','En progreso','Intermedio','Avanzado','Experto'];
const DEFAULT_SKILLS=[
 {name:'Python',cat:'Lenguajes',level:4},{name:'Java',cat:'Lenguajes',level:3},{name:'JavaScript',cat:'Lenguajes',level:3},{name:'C++',cat:'Lenguajes',level:3},
 {name:'HTML y CSS',cat:'Desarrollo web',level:4},{name:'Diseño responsive',cat:'Desarrollo web',level:3},{name:'APIs del navegador',cat:'Desarrollo web',level:2},
 {name:'SQL',cat:'Datos y herramientas',level:3},{name:'Git y GitHub',cat:'Datos y herramientas',level:4},{name:'VS Code',cat:'Datos y herramientas',level:4},{name:'Linux (terminal)',cat:'Datos y herramientas',level:2},
 {name:'Lógica de programación',cat:'Fundamentos',level:4},{name:'Estructuras de datos',cat:'Fundamentos',level:3},{name:'Algoritmos',cat:'Fundamentos',level:3},{name:'Programación orientada a objetos',cat:'Fundamentos',level:3},
 {name:'Trabajo en equipo',cat:'Habilidades blandas',level:4},{name:'Resolución de problemas',cat:'Habilidades blandas',level:4},{name:'Comunicación',cat:'Habilidades blandas',level:3}];

 'Lenguajes':'<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>',
 'Desarrollo web':'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
 'Datos y herramientas':'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
 'Fundamentos':'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8l3.5 8M16.5 8L13 16"/>',
 'Habilidades blandas':'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/>'};
/* pm: vista pública o de edición; pub: contenido publicado en el repositorio (lo que ven los visitantes) */
const S={c:0,u:0,imgs:[],photo:null,photoBlob:null,user:null,weekDetails:{},pm:true,pub:null};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
/* Las versiones anteriores guardaban las habilidades como texto; se convierten al formato con categoría y nivel */
const normSkill=s=>{if(typeof s!=='string')return s;const d=DEFAULT_SKILLS.find(x=>x.name.toLocaleLowerCase()===s.toLocaleLowerCase());return d?{...d,name:s}:{name:s,cat:'Fundamentos',level:3}};
const getSkills=()=>(S.pub?S.pub.skills||DEFAULT_SKILLS:lsGet('skills',DEFAULT_SKILLS)).map(normSkill);
const ownerName=()=>S.pub?.name||lsGet('user',{name:OWNER}).name;

const REPO=location.hostname.endsWith('.github.io')?`${location.hostname.split('.')[0]}/${location.hostname}`:'pieroflores901-code/pieroflores901-code.github.io';

/* ---------- Base de datos local (IndexedDB) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('portafolio-upla',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('imgs',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('kv')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,mode,fn)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};

async function loadPublished(){
 try{
  const r=await fetch(`data/portfolio.json?v=${Date.now()}`,{cache:'no-store'});
  if(!r.ok)return false;
  const d=await r.json();
  S.pub=d;S.weekDetails=d.weekDetails||{};S.photo=d.photo||null;
  S.imgs=(d.files||[]).map(f=>({...f,url:f.path}));
  return true;
 }catch{return false}
}
async function load(publicMode){
 S.pub=null;
 /* Los visitantes ven lo publicado; si aún no hay nada publicado se usa lo guardado en este navegador */
 if(publicMode&&await loadPublished())return;
 S.weekDetails=lsGet('weekDetails',{});
 const all=await tx('imgs','readonly',s=>s.getAll());
 all.sort((a,b)=>a.id-b.id);
 S.imgs=all.map(r=>({...r,kind:r.kind||fileKind({name:r.name,type:r.blob.type})||'image',url:URL.createObjectURL(r.blob)}));
 const p=await tx('kv','readonly',s=>s.get('photo'));
 S.photoBlob=p||null;S.photo=p?URL.createObjectURL(p):null;
}

/* ---------- Publicación en GitHub (un solo commit con todo el contenido en data/) ---------- */
const toB64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s)};
const gitSha=async bytes=>{const h=new TextEncoder().encode(`blob ${bytes.length}\0`);const all=new Uint8Array(h.length+bytes.length);all.set(h);all.set(bytes,h.length);
 return [...new Uint8Array(await crypto.subtle.digest('SHA-1',all))].map(x=>x.toString(16).padStart(2,'0')).join('')};
const safeName=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'archivo';
async function publish(token){
 const api=async(p,o={})=>{const r=await fetch(`https://api.github.com/repos/${REPO}${p}`,{...o,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json',...(o.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const m=(await r.json().catch(()=>({}))).message||'';throw new Error(r.status===401?'El token no es válido o expiró.':r.status===403||r.status===404?'El token no tiene permiso de escritura (Contents: Read and write) en el repositorio.':`GitHub respondió ${r.status} ${m}`)}
  return r.json()};
 toast('Conectando con GitHub…');
 const ref=await api(`/git/ref/heads/${BRANCH}`);
 const head=await api(`/git/commits/${ref.object.sha}`);
 const tree=await api(`/git/trees/${head.tree.sha}?recursive=1`);
 const have=new Map(tree.tree.filter(e=>e.type==='blob').map(e=>[e.path,e.sha]));
 const entries=[],keep=new Set();
 const put=async(path,data)=>{keep.add(path);const bytes=data instanceof Blob?new Uint8Array(await data.arrayBuffer()):new TextEncoder().encode(data);
  const sha=await gitSha(bytes);if(have.get(path)===sha)return;
  const b=await api('/git/blobs',{method:'POST',body:JSON.stringify({content:toB64(bytes),encoding:'base64'})});
  entries.push({path,mode:'100644',type:'blob',sha:b.sha})};
 toast('Leyendo el texto de los trabajos…');await backfillText();
 const files=[];let n=0;
 for(const f of S.imgs){
  toast(`Subiendo ${++n} de ${S.imgs.length}…`);
  const path=`data/files/${f.slot}/${f.id}-${safeName(f.name)}`;
  await put(path,f.blob);files.push({slot:f.slot,name:f.name,kind:f.kind,path,...(f.text?{text:f.text}:{})});
 }
 let photo=null;
 if(S.photoBlob){const bytes=new Uint8Array(await S.photoBlob.arrayBuffer());photo=`data/photo-${(await gitSha(bytes)).slice(0,10)}.jpg`;await put(photo,S.photoBlob)}
 await put('data/portfolio.json',JSON.stringify({name:lsGet('user',{name:OWNER}).name,photo,skills:getSkills(),weekDetails:S.weekDetails,files},null,1));
 await put('.nojekyll','');
 for(const p of have.keys())if(p.startsWith('data/')&&!keep.has(p))entries.push({path:p,mode:'100644',type:'blob',sha:null});
 if(!entries.length)return toast('Todo ya estaba publicado');
 toast('Guardando en el repositorio…');
 const nt=await api('/git/trees',{method:'POST',body:JSON.stringify({base_tree:head.tree.sha,tree:entries})});
 const c=await api('/git/commits',{method:'POST',body:JSON.stringify({message:'Publicar contenido del portafolio',tree:nt.sha,parents:[ref.object.sha]})});
 await api(`/git/refs/heads/${BRANCH}`,{method:'PATCH',body:JSON.stringify({sha:c.sha})});
 toast('¡Publicado! En 1 o 2 minutos todos verán los cambios en el link.');
}

/* ---------- Utilidades ---------- */
const hash=async p=>{if(!crypto.subtle)return btoa(p);
 const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('upla:'+p));
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
async function shrink(f,max=1600){
 const bm=await createImageBitmap(f);const k=Math.min(1,max/Math.max(bm.width,bm.height));
 const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
 c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('No se pudo procesar la imagen')),'image/jpeg',.82))}
const toast=(t,ms=2600)=>{const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',ms)};
const slotImgs=s=>S.imgs.filter(i=>i.slot===s);
/* Las imágenes se muestran como miniatura; cualquier otro archivo se guarda tal cual y se ofrece para descargar */
const fileKind=f=>/^image\/(avif|bmp|gif|jpeg|png|webp)$/.test(f.type)||(!f.type&&/\.(avif|bmp|gif|jpe?g|png|webp)$/i.test(f.name))?'image':'file';
const DOC_TYPES={pdf:'PDF',doc:'Word',docx:'Word',odt:'documento',xls:'Excel',xlsx:'Excel',csv:'CSV',ods:'hoja de cálculo',ppt:'PowerPoint',pptx:'PowerPoint',odp:'presentación',txt:'texto',zip:'ZIP',rar:'RAR','7z':'7Z',svg:'SVG'};
const docLabel=name=>{const ext=(name.match(/\.([^.]+)$/)?.[1]||'').toLocaleLowerCase();return DOC_TYPES[ext]||(ext?ext.toUpperCase():'archivo')};
const safeLink=value=>{try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:null}catch{return null}};

/* ---------- Lectura de trabajos: se extrae el texto de cada archivo para que Rayas pueda responder sobre él ---------- */
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const TEXT_LIMIT=20000;
const libs={};
const lib=src=>libs[src]??=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error(`No se pudo cargar ${src}`))};document.head.append(s)});
const decodeXml=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const clip=s=>s.replace(/[ \t\r\f\v]+/g,' ').replace(/\n\s*\n+/g,'\n').trim().slice(0,TEXT_LIMIT);
const PLAIN_EXT=['txt','md','csv','json','html','htm','css','js','ts','py','java','c','cpp','cs','h','sql','xml','php'];
async function extractText(blob,name){
 const ext=(name.match(/\.([^.]+)$/)?.[1]||'').toLocaleLowerCase();
 try{
  if(PLAIN_EXT.includes(ext))return clip(await blob.text());
  if(ext==='pdf'){
   await lib(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js');
   const doc=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;let out='';
   for(let i=1;i<=Math.min(doc.numPages,40)&&out.length<TEXT_LIMIT;i++){const c=await(await doc.getPage(i)).getTextContent();out+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}
   return clip(out);
  }
  if(['docx','pptx','xlsx'].includes(ext)){
   await lib(JSZIP);const zip=await JSZip.loadAsync(blob);
   const parts=Object.keys(zip.files).filter(n=>ext==='docx'?n==='word/document.xml':ext==='pptx'?/^ppt\/slides\/slide\d+\.xml$/.test(n):n==='xl/sharedStrings.xml').sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   let out='';
   for(const n of parts)out+=(await zip.file(n).async('string')).replace(/<(w:tab|w:br|a:br)\b[^>]*\/>/g,' ').replace(/<\/(w:p|a:p|si)>/g,'\n').replace(/<[^>]+>/g,'')+'\n';
   return clip(decodeXml(out));
  }
 }catch(error){console.warn(`No se pudo leer el texto de ${name}`,error)}
 return '';
}
/* Los archivos subidos antes de esta función todavía no tienen texto: se completa en segundo plano */
async function backfillText(){
 for(const f of S.imgs){
  if(f.text!==undefined||!f.blob)continue;
  f.text=await extractText(f.blob,f.name);
  const {url,...rec}=f;await tx('imgs','readwrite',s=>s.put(rec)).catch(()=>{});
 }
}
/* ---------- Asistente: responde con los datos reales del portafolio ---------- */
const norm=s=>String(s).toLocaleLowerCase('es').normalize('NFD').replace(/[̀-ͯ]/g,'');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const listEs=a=>a.length<2?a.join(''):`${a.slice(0,-1).join(', ')} y ${a.at(-1)}`;
const skillLevel=s=>Math.min(5,Math.max(1,+s.level||3));
const CAT_WORDS={'Lenguajes':/lenguaje/,'Desarrollo web':/\bweb\b|frontend|pagina/,'Datos y herramientas':/\bdatos\b|herramienta|base de datos/,'Fundamentos':/fundamento|teori/,'Habilidades blandas':/blanda|soft|equipo|personal/};
const HOWTO=[
 [/habilidad|skill|nivel|categoria/,'En “Administrar”, agrega una habilidad con su nombre, categoría y nivel. Para cambiar el nivel de una existente, toca uno de sus segmentos; para quitarla, usa el botón × junto a ella.'],
 [/titulo|enlace|link/,'En “Administrar”, cada semana tiene campos opcionales para título y enlace. Escribe lo que quieras y pulsa “Guardar”; el enlace debe empezar con http:// o https://.'],
 [/imagen|foto|subir|cargar|archivo|documento|pdf|word|excel|powerpoint|zip/,'En “Administrar”, abre el curso y la unidad; en la semana elegida puedes arrastrar o seleccionar cualquier archivo: imágenes, PDF, Word, Excel, PowerPoint, ZIP y más. La foto del perfil se cambia desde “Cambiar foto”.'],
 [/guardar|datos|privacidad|navegador|dispositivo/,'Los archivos de cada semana y la foto se guardan en este navegador (IndexedDB); los títulos, enlaces y habilidades, en el almacenamiento local. No se sincronizan con otros dispositivos.'],
 [/admin|administrar|contrasena|sesion|entrar|editar/,'Pulsa “Administrar” arriba a la derecha e inicia sesión. Desde ahí puedes editar todo el contenido y cerrar sesión.'],
 [/semana|unidad|curso|navegar|buscar/,'Usa las pestañas de curso y los botones de unidad en la sección “Trabajos”. También puedes preguntarme directamente, por ejemplo: “¿qué hizo en la semana 2 de Algoritmo?”.']];
function weekReply(q,n){
 const um=q.match(/unidad\s*(\d)/);
 const c=/taller|aplicaciones/.test(q)?0:/algoritmo|estructura/.test(q)?1:S.c;
 let un=um?+um[1]-1:S.u,w=n-1;
 /* Sin unidad, una semana mayor a 4 se entiende como el número de semana del curso (1–16) */
 if(!um&&n>4){un=Math.floor((n-1)/4);w=(n-1)%4}
 if(n<1||n>16||w>3||un<0||un>3)return 'Cada curso tiene 4 unidades con 4 semanas cada una (16 en total). Prueba con “semana 2 de la unidad 1”.';
 const slot=`${c}-${un}-${w}`,files=slotImgs(slot),d=S.weekDetails[slot]||{},link=safeLink(d.link||'');
 const where=`la semana ${w+1} de la unidad ${un+1} de ${COURSES[c]}`;
 if(!files.length&&!d.title&&!link)return `Todavía no hay trabajos publicados en ${where}.`;
 return [
  d.title?`En ${where} el trabajo se titula “${d.title}”.`:`En ${where} hay trabajos publicados.`,
  files.length?`Tiene ${files.length} ${files.length===1?'archivo':'archivos'}: ${listEs(files.slice(0,4).map(f=>f.name))}${files.length>4?' y más':''}.`:'',
  link?`También incluye un enlace a ${new URL(link).hostname.replace(/^www\./,'')}.`:'',
  files.some(f=>f.text)?`\n📚 De lo que leí: “${short(files.find(f=>f.text).text,260)}”`:''].filter(Boolean).join(' ');
}
const short=(t,n)=>{t=t.replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+'…':t};
const slotLabel=slot=>{const [c,u,w]=slot.split('-').map(Number);return `semana ${w+1} de la unidad ${u+1} de ${COURSES[c]}`};
function worksOverview(){
 const out=[];
 for(let c=0;c<COURSES.length;c++)for(let u=0;u<4;u++)for(let w=0;w<4;w++){
  const slot=`${c}-${u}-${w}`,files=slotImgs(slot),d=S.weekDetails[slot]||{};
  if(!files.length&&!d.title&&!d.link)continue;
  const t=files.find(f=>f.text)?.text;
  out.push(`• ${COURSES[c]}, unidad ${u+1}, semana ${w+1}: ${d.title||files[0]?.name||'enlace publicado'}${t?` — ${short(t,90)}`:''}`);
 }
 return out.length?`Estos son sus trabajos publicados 🐯\n${out.slice(0,8).join('\n')}${out.length>8?`\n…y ${out.length-8} más. Pregúntame por una semana concreta.`:''}`:'Todavía no hay trabajos publicados. ¡Pronto habrá!';
}

/* Búsqueda dentro del texto de los trabajos: se elige el fragmento que comparte más palabras con la pregunta */
const STOP=new Set('que cual cuales como donde cuando quien para por con sin los las del una uno unos unas este esta esto ese esa eso hay tiene tienen sobre entre pero mas muy sus son fue ser esta estan hizo hace hacer dime cuentame sabes explica explicame habla trata tratan trabajo trabajos semana unidad curso archivo documento segun dice algo todo'.split(' '));
const stem=w=>w.length>5?w.slice(0,5):w;
const wordsOf=s=>(norm(s).match(/[a-z0-9+#]+/g)||[]).map(stem);
const chunkCache=new WeakMap();
function searchDocs(question){
 const ws=[...new Set((norm(question).match(/[a-z0-9+#]+/g)||[]).filter(w=>w.length>2&&!STOP.has(w)).map(stem))];
 if(!ws.length)return null;
 let best=null;
 for(const f of S.imgs){
  if(!f.text)continue;
  if(!chunkCache.has(f)){const parts=f.text.split(/(?<=[.!?])\s+|\n+/).map(t=>t.trim()).filter(t=>t.length>15);chunkCache.set(f,parts.map((p,i)=>{const t=parts.slice(i,i+2).join(' ');return {t,w:new Set(wordsOf(t))}}))}
  /* Las palabras que ya están en el nombre del archivo cuentan una vez para el archivo, no para elegir el fragmento */
  const fname=norm(f.name),inName=ws.filter(w=>fname.includes(w)),rest=ws.filter(w=>!fname.includes(w)),topic=rest.length?rest:ws;
  for(const ch of chunkCache.get(f)){const score=topic.filter(w=>ch.w.has(w)).length+inName.length*.75;if(score>(best?.score||0))best={score,t:ch.t,f}}
 }
 if(!best||best.score<Math.max(1,Math.ceil(ws.length*.4)))return null;
 return `📚 En “${best.f.name}” (${slotLabel(best.f.slot)}) encontré esto:\n“${short(best.t,380)}”`;
}

/* ---------- Matemática: operaciones, porcentajes, funciones y ecuaciones con x (sin eval) ---------- */
const FUNCS={sqrt:Math.sqrt,sin:x=>Math.sin(x*Math.PI/180),cos:x=>Math.cos(x*Math.PI/180),tan:x=>Math.tan(x*Math.PI/180),log:Math.log10,ln:Math.log,abs:Math.abs,exp:Math.exp};
const CONSTS={pi:Math.PI,e:Math.E};
const fact=n=>{if(n<0||n>170||!Number.isInteger(n))return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const fmt=v=>(+v.toPrecision(12)).toLocaleString('es-PE',{maximumFractionDigits:8});
function mathPrep(q){
 let s=norm(q).replace(/[¿?¡]/g,' ').replace(/\b(por favor|porfa|porfis)\b/g,' ')
  .replace(/(\d),(\d)/g,'$1.$2').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/√/g,' sqrt ')
  .replace(/(\d+(?:\.\d+)?)\s*(%|por ciento)\s*(de)?/g,'($1/100)*')
  .replace(/\braiz cuadrada( de)?\b|\braiz( de)?\b/g,' sqrt ')
  .replace(/\bseno( de)?\b|\bsen\b/g,' sin ').replace(/\bcoseno( de)?\b/g,' cos ').replace(/\btangente( de)?\b/g,' tan ')
  .replace(/\blogaritmo natural( de)?\b/g,' ln ').replace(/\blogaritmo( de)?\b/g,' log ').replace(/\bvalor absoluto( de)?\b/g,' abs ')
  .replace(/\bfactorial de\s*(\d+)/g,' $1! ').replace(/\b(sqrt|sin|cos|tan|log|ln|abs)\s+de\b/g,'$1 ')
  .replace(/\b(es )?igual a\b/g,' = ').replace(/\bal cuadrado\b/g,'^2').replace(/\bal cubo\b/g,'^3').replace(/\belevado al?\b/g,'^')
  .replace(/\b(multiplicado por|por|veces)\b/g,' * ').replace(/\b(dividido entre|dividido por|dividido|entre)\b/g,' / ')
  .replace(/\bmas\b/g,' + ').replace(/\bmenos\b/g,' - ')
  .replace(/\b(cuanto|cuantos|cuanta|es|son|el|la|los|las|de|del|calcula|calcular|calculame|resuelve|resolver|resuelveme|resultado|cual|seria|sale|da|me|dime|halla|hallar|encuentra|ecuacion|operacion|rayas)\b/g,' ');
 if(!s.includes('='))s=s.replace(/(\d)\s*x\s*(?=[\d(])/g,'$1*');
 return s.replace(/\s+/g,' ').trim();
}
function parseMath(src){
 const toks=[],re=/\s*(\d+(?:\.\d+)?|[a-z]+|[-+*/^()!=])/y;
 while(re.lastIndex<src.length){const m=re.exec(src);if(!m){if(/^\s*$/.test(src.slice(re.lastIndex)))break;throw 0}toks.push(m[1])}
 let i=0,usesX=false;
 const pk=()=>toks[i],nx=()=>toks[i++];
 const starts=t=>t!==undefined&&/^[\d(a-z]/.test(t);
 const expr=()=>{let a=term();while(pk()==='+'||pk()==='-'){const o=nx(),b=term(),l=a;a=o==='+'?x=>l(x)+b(x):x=>l(x)-b(x)}return a};
 const term=()=>{let a=unary();for(;;){const t=pk();
  if(t==='*'||t==='/'){nx();const b=unary(),l=a;a=t==='*'?x=>l(x)*b(x):x=>l(x)/b(x)}
  else if(starts(t)){const b=power(),l=a;a=x=>l(x)*b(x)}
  else return a}};
 const unary=()=>{if(pk()==='-'){nx();const a=unary();return x=>-a(x)}if(pk()==='+'){nx();return unary()}return power()};
 const power=()=>{const b=postfix();if(pk()==='^'){nx();const e=unary();return x=>Math.pow(b(x),e(x))}return b};
 const postfix=()=>{let a=primary();while(pk()==='!'){nx();const l=a;a=x=>fact(l(x))}return a};
 const primary=()=>{const t=nx();
  if(t===undefined)throw 0;
  if(/^\d/.test(t)){const v=+t;return()=>v}
  if(t==='('){const a=expr();if(nx()!==')')throw 0;return a}
  if(t==='x'){usesX=true;return x=>x}
  if(t in CONSTS){const v=CONSTS[t];return()=>v}
  if(t in FUNCS){const f=FUNCS[t],a=power();return x=>f(a(x))}
  throw 0};
 const lhs=expr();let rhs=null;
 if(pk()==='='){nx();rhs=expr()}
 if(i<toks.length)throw 0;
 return {lhs,rhs,usesX,ops:toks.some(t=>/^[-+*/^!]$/.test(t)||t in FUNCS)};
}
function mathReply(question){
 const q=norm(question).replace(/(\d),(\d)/g,'$1.$2'),nums=(q.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
 if(/\b(promedio|media)\b/.test(q)&&nums.length>1)return `🧮 El promedio de ${listEs(nums.map(fmt))} es ${fmt(nums.reduce((a,b)=>a+b,0)/nums.length)}.`;
 if(/\bsuma(r)?\b/.test(q)&&nums.length>1&&!/[*/^x]/.test(q))return `🧮 ${nums.map(fmt).join(' + ')} = ${fmt(nums.reduce((a,b)=>a+b,0))}`;
 const src=mathPrep(question);
 if(!/\d/.test(src))return null;
 let p;try{p=parseMath(src)}catch{return null}
 const pretty=src.replace(/sqrt ?/g,'√').replace(/\*/g,'×').replace(/\//g,'÷');
 if(p.rhs){
  if(!p.usesX){const a=p.lhs(0),b=p.rhs(0);return Math.abs(a-b)<1e-9?`✅ Correcto: ${pretty}`:`❌ No es correcto: el lado izquierdo da ${fmt(a)} y el derecho ${fmt(b)}.`}
  const f=x=>p.lhs(x)-p.rhs(x),f0=f(0),f1=f(1),f2=f(2),a=(f2-2*f1+f0)/2,b=f1-f0-a,c=f0;
  if(![f0,f1,f2].every(Number.isFinite)||Math.abs(f(3)-(9*a+3*b+c))>1e-6*Math.max(1,Math.abs(f(3))))return 'Resuelvo ecuaciones lineales y cuadráticas con x, por ejemplo “2x + 3 = 11” o “x^2 - 5x + 6 = 0”.';
  if(Math.abs(a)<1e-12){if(Math.abs(b)<1e-12)return Math.abs(c)<1e-12?'Esa ecuación se cumple para cualquier valor de x.':'Esa ecuación no tiene solución.';return `🧮 ${pretty}\nx = ${fmt(-c/b)}`}
  const d=b*b-4*a*c;
  if(d<-1e-12)return `🧮 ${pretty}\nNo tiene soluciones reales: el discriminante es ${fmt(d)}.`;
  const r1=(-b+Math.sqrt(Math.max(0,d)))/(2*a),r2=(-b-Math.sqrt(Math.max(0,d)))/(2*a);
  return Math.abs(r1-r2)<1e-9?`🧮 ${pretty}\nx = ${fmt(r1)}`:`🧮 ${pretty}\nx₁ = ${fmt(r1)} y x₂ = ${fmt(r2)}`;
 }
 if(p.usesX||!p.ops)return null;
 const v=p.lhs(0);
 if(!Number.isFinite(v))return 'Esa operación no tiene un resultado definido (¿una división entre cero? 🐯).';
 return `🧮 ${pretty} = ${fmt(v)}${/sin|cos|tan/.test(src)?'\n(Los ángulos se toman en grados.)':''}`;
}

const CONCEPTS=[

 [/\bpila|stack/,'Una pila (stack) es una estructura LIFO: el último elemento en entrar es el primero en salir. Sus operaciones son push (apilar), pop (desapilar) y peek (ver la cima). Se usa en el “deshacer” y en las llamadas a funciones.'],

 [/lista enlazada|linked list/,'Una lista enlazada es una secuencia de nodos en la que cada nodo guarda un dato y una referencia al siguiente. Insertar y eliminar es rápido (O(1) si tienes el nodo), pero acceder por posición cuesta O(n).'],

  }catch(error){
   console.error(`No se pudo guardar ${file.name}`,error);
   toast(`No se pudo guardar ${file.name}. Revisa el espacio disponible en el navegador.`);
   view();return;
  }
 }
 toast(`${fs.length} archivo(s) guardados`);view();
}
async function delImage(id){
 await tx('imgs','readwrite',s=>s.delete(id));
 const i=S.imgs.findIndex(x=>x.id===id);if(i>=0){URL.revokeObjectURL(S.imgs[i].url);S.imgs.splice(i,1)}
 view();
}

/* ---------- Vistas ---------- */
const logo=`<img class="logo" src="upla-logo.png" width="32" height="37" alt="Logo de la Universidad Peruana Los Andes">`;
function authView(){
 const u=lsGet('user',null);
 $('#app').innerHTML=`<form class="auth" id="af">
  ${logo}
  <h1>${u?'Iniciar sesión':'Crear cuenta'}</h1>
  ${u?`<p style="margin:0;color:var(--mut)">Hola, ${esc(u.name)}. Ingresa tu contraseña para editar el portafolio.</p>`:`<input type="text" id="nm" value="${OWNER}" aria-label="Nombre completo" required>`}
  <input type="password" id="pw" placeholder="Contraseña" aria-label="Contraseña" required minlength="4">
  <div class="err" id="er"></div>
  <button class="p" type="submit">${u?'Entrar':'Crear cuenta y entrar'}</button>
  <a href="./">Volver al portafolio público</a>
 </form>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;const h=await hash(pw);
  if(u){if(h!==u.h)return $('#er').textContent='Contraseña incorrecta. Inténtalo de nuevo.'}
  else lsSet('user',{name:$('#nm').value.trim(),h});
  sessionStorage.setItem('ok','1');history.replaceState(null,'',`${location.pathname}?admin=1`);start(false)};

function skillsView(publicMode){
 const skills=getSkills();
 const groups=SKILL_CATS.map(cat=>{
  const items=skills.map((s,i)=>({...s,i})).filter(s=>s.cat===cat||(cat==='Fundamentos'&&!SKILL_CATS.includes(s.cat)));
  if(!items.length)return '';
  return `<section class="skill-group ${publicMode?'tilt':''}"><h3><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CAT_ICONS[cat]}</svg>${cat}</h3><ul>${items.map(s=>{
   const lv=Math.min(5,Math.max(1,+s.level||3));
   const segs=[1,2,3,4,5].map(n=>publicMode?`<span class="${n<=lv?'on':''}"></span>`:`<button type="button" class="${n<=lv?'on':''}" data-sk="${s.i}" data-lv="${n}" aria-label="Nivel ${LEVELS[n]} para ${esc(s.name)}"></button>`).join('');
   return `<li class="skill"><span>${esc(s.name)}</span><span class="meter" role="img" aria-label="Nivel: ${LEVELS[lv]}" title="${LEVELS[lv]}">${segs}</span>${publicMode?'':`<button class="skill-x" data-rs="${s.i}" aria-label="Quitar ${esc(s.name)}">×</button>`}</li>`}).join('')}</ul></section>`}).join('');
 return `<div class="skill-grid">${groups||'<p class="public-empty">Agrega tu primera habilidad para mostrarla aquí.</p>'}</div>
  <p class="legend"><span>1 · Básico</span><span>3 · Intermedio</span><span>5 · Experto</span></p>
  ${publicMode?'':`<form class="add" id="sf"><input type="text" id="sk" placeholder="Nombre de la habilidad" aria-label="Nueva habilidad" required>
   <select id="skc" aria-label="Categoría">${SKILL_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
   <select id="skl" aria-label="Nivel">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===3?'selected':''}>${LEVELS[n]}</option>`).join('')}</select>
   <button class="p">Agregar habilidad</button></form>`}`;
}
/* Sin argumento se conserva el modo actual: cambiar de curso o unidad no debe pasar a modo edición */
function view(publicMode=S.pm){
 S.pm=publicMode;
 const u={name:ownerName()};const c=S.c;
 const weekIndexes=[0,1,2,3].filter(w=>{
  const slot=`${c}-${S.u}-${w}`;const detail=S.weekDetails[slot];
  return !publicMode||slotImgs(slot).length||detail?.title||detail?.link;
 });
 const weeks=weekIndexes.map(w=>{const slot=`${c}-${S.u}-${w}`;const im=slotImgs(slot);
  const detail=S.weekDetails[slot]||{title:'',link:''};const link=safeLink(detail.link||'');
  return `<section class="wk ${im.length?'has':''} ${publicMode?'tilt':''}" id="w${w}">
   <h3>Semana ${w+1}<small>${im.length?`${im.length} ${im.length===1?'archivo':'archivos'}`:'Sin archivos'}</small></h3>
   ${detail.title||link?`<div class="week-details">${detail.title?`<h4 class="week-title">${esc(detail.title)}</h4>`:''}${link?`<a class="week-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Abrir en ${esc(new URL(link).hostname.replace(/^www\./,''))} ↗</a>`:''}</div>`:''}
   ${publicMode?'':`<form class="week-meta" data-slot="${slot}">
    <label>Título (opcional)<input type="text" name="title" value="${esc(detail.title||'')}" placeholder="Título de la semana"></label>
    <label>Enlace (opcional)<input type="url" name="link" value="${esc(detail.link||'')}" placeholder="https://..."><small>Si es de OneDrive o Google Drive, usa “Compartir” con acceso para cualquier persona con el vínculo.</small></label>
    <button class="p">Guardar</button>
   </form>`}
   ${publicMode?'':`<label class="drop" data-slot="${slot}"><input type="file" multiple data-slot="${slot}">Arrastra tus archivos aquí o toca para elegirlos<br>(imágenes, PDF, Word, Excel, PowerPoint, ZIP y más)</label>`}
   <div class="thumbs">${im.map((x,i)=>`<div class="th ${x.kind==='image'?'':'document'}">${x.kind==='image'?`<img src="${x.url}" alt="${esc(x.name)}" data-big="${x.url}">`:`<a href="${x.url}" download="${esc(x.name)}">${esc(x.name)}<small>Descargar ${docLabel(x.name)}</small></a>`}<i>${i+1}</i>${publicMode?'':`<button data-del="${x.id}" aria-label="Eliminar ${esc(x.name)}">×</button>`}</div>`).join('')}</div>
   ${!publicMode&&w<3?`<button class="nx" data-next="${w+1}">Siguiente semana</button>`:''}
  </section>`}).join('');
 const progress=COURSES.map((n,i)=>{const d=doneWeeks(i);return `<div><p><b>${n}</b><span>${d} de 16 semanas</span></p><div class="bar" role="progressbar" aria-label="Avance en ${n}" aria-valuemin="0" aria-valuemax="16" aria-valuenow="${d}"><i style="width:${d/16*100}%"></i></div></div>`}).join('');
 $('#app').innerHTML=`
 <header>
  ${logo}
  <div class="t"><b>${esc(u.name)}</b><span>Universidad Peruana Los Andes</span></div>
  <nav aria-label="Secciones"><a href="#trabajos">Trabajos</a><a href="#habilidades">Habilidades</a></nav>
  <a class="btn ${publicMode?'p':''}" href="${publicMode?'?admin=1':'./'}">${publicMode?'Administrar':'Ver portafolio'}</a>
  ${publicMode?'':'<button id="out">Cerrar sesión</button>'}
 </header>
 <main>
  <div class="hero">
   <div class="floor" aria-hidden="true"></div>
   <div>
    <p class="kicker">${publicMode?`Estudiante de ${CAREER}`:'Modo edición'}</p>
    <h1>${esc(u.name)}</h1>
    <p class="lead">${publicMode?`Aquí reúno los trabajos que desarrollo en la <b>Universidad Peruana Los Andes</b>, ordenados por curso, unidad y semana, junto con las herramientas que uso para construir software.`:`Registra las tareas de <b>${COURSES[0]}</b> y <b>${COURSES[1]}</b> en el mismo orden en que se dictaron en clase. Los cambios se ven al instante en la vista pública.`}</p>
    <div class="prog">${progress}</div>
   </div>
   <div class="ph"><div class="box"><div class="face">${S.photo?`<img src="${S.photo}" alt="Foto de ${esc(u.name)}">`:esc(initials(u.name))}</div></div>${publicMode?'':'<label>Cambiar foto<input type="file" accept="image/*" id="pf" hidden></label>'}</div>
  </div>
  ${publicMode?'':`<form class="publish" id="pubf">
   <div><h3>Publicar para todos</h3><p>Lo que editas aquí solo se guarda en este navegador. Pulsa “Publicar” para que cualquiera que abra tu link vea tus trabajos, foto y habilidades.</p></div>
   <input type="password" id="ght" value="${esc(lsGet('ghToken',''))}" placeholder="Token de GitHub (github_pat_…)" aria-label="Token de GitHub" autocomplete="off" required>
   <button class="p" type="submit">Publicar</button>
   <small>Crea el token en GitHub → Settings → Developer settings → Fine-grained tokens, solo para el repositorio <b>${esc(REPO)}</b>, con permiso <b>Contents: Read and write</b>. Se guarda solo en este navegador.</small>
  </form>`}
  <section class="section" id="trabajos">
   <div class="section-head"><div><h2>Trabajos</h2><p>${publicMode?'Elige un curso y una unidad para ver las entregas de cada semana.':'Sube archivos, títulos y enlaces para cada semana.'}</p></div>
   <div class="tabs" role="tablist">${COURSES.map((n,i)=>`<button role="tab" aria-selected="${i===c}" data-c="${i}">${n}</button>`).join('')}</div></div>
   <div class="units">${[0,1,2,3].map(i=>`<button type="button" aria-selected="${i===S.u}" data-u="${i}">Unidad ${i+1}</button>`).join('')}</div>
   <div class="weeks">${weeks||(publicMode?'<p class="public-empty">Esta unidad todavía no tiene entregas publicadas.</p>':'')}</div>
  </section>
  <section class="section" id="habilidades">
   <div class="section-head"><div><h2>Habilidades</h2><p>Lenguajes, herramientas y fundamentos que aplico en mis proyectos, con mi nivel actual en cada uno.</p></div></div>
   ${skillsView(publicMode)}
  </section>
  ${publicMode?`<footer class="public-footer"><span class="foot-brand">${logo}${esc(u.name)}</span><span>${CAREER} · Universidad Peruana Los Andes</span></footer>`:'<p class="note">Tus imágenes, documentos, títulos, enlaces y habilidades se guardan en este navegador hasta que pulses “Publicar”. Si borras los datos del navegador o cambias de dispositivo, no los verás aquí: conserva una copia de tus archivos originales.</p>'}
 </main>`;
}

/* ---------- Eventos ---------- */
const app=$('#app');
const chatPanel=$('#chat-panel'),chatToggle=$('#chat-toggle'),chatMessages=$('#chat-messages');
function setChatOpen(open){chatPanel.hidden=!open;chatToggle.setAttribute('aria-expanded',String(open));if(open)$('#chat-input').focus()}
function addChatMessage(text,kind){
 const message=document.createElement('div');message.className=`chat-message ${kind}`.trim();message.textContent=text;chatMessages.append(message);chatMessages.scrollTop=chatMessages.scrollHeight;
 return message;
}
/* Muestra “escribiendo…” un instante antes de responder, para que la respuesta se note como nueva */
function askChat(question){
 chatMessages.querySelector('.chat-suggest')?.remove();
 addChatMessage(question,'user');
 const typing=addChatMessage('','typing');typing.innerHTML='<span></span><span></span><span></span>';typing.setAttribute('aria-label','Escribiendo');
 chatPanel.classList.add('talking');clearTimeout(askChat.t);
 setTimeout(()=>{
  let answer;try{answer=chatReply(question)}catch(error){console.error(error);answer='Uy, se me enredaron las rayas 🐯. Intenta preguntarlo de otra forma.'}
  typing.className='chat-message';typing.removeAttribute('aria-label');typing.textContent=answer;chatMessages.scrollTop=chatMessages.scrollHeight;
  askChat.t=setTimeout(()=>chatPanel.classList.remove('talking'),Math.min(2400,400+answer.length*8));
 },500);
}
/* El tigre se dibuja en el botón y en la cabecera del chat; sus pupilas siguen al puntero */
const TIGER=`<svg class="tiger" viewBox="0 0 64 64" aria-hidden="true">
 <g class="t-ear t-ear-l"><path d="M9 25 7 6l18 8z" fill="#f28c28"/><path d="M12 20l-1-9 8 4z" fill="#ffe0bd"/></g>
 <g class="t-ear t-ear-r"><path d="M55 25l2-19-18 8z" fill="#f28c28"/><path d="M52 20l1-9-8 4z" fill="#ffe0bd"/></g>
 <ellipse cx="32" cy="36" rx="25" ry="22" fill="#f7a23b"/>
 <path d="M32 14v8M25.5 15l2.2 6.5M38.5 15l-2.2 6.5M7.5 33h7M8.5 40l6.5-2.5M56.5 33h-7M55.5 40l-6.5-2.5" stroke="#2b1607" stroke-width="2.6" stroke-linecap="round"/>
 <ellipse cx="25" cy="45" rx="9.5" ry="7.5" fill="#fff5e8"/><ellipse cx="39" cy="45" rx="9.5" ry="7.5" fill="#fff5e8"/>
 <g class="t-eyes"><ellipse cx="23" cy="31" rx="4.8" ry="5.2" fill="#fff"/><ellipse cx="41" cy="31" rx="4.8" ry="5.2" fill="#fff"/>
  <g class="t-pupils"><circle cx="23" cy="31.5" r="2.7" fill="#1d2b1c"/><circle cx="41" cy="31.5" r="2.7" fill="#1d2b1c"/><circle cx="24" cy="30.3" r=".9" fill="#fff"/><circle cx="42" cy="30.3" r=".9" fill="#fff"/></g></g>
 <path d="M28.5 39.5h7L32 43.5z" fill="#e04b5f"/>
 <path d="M32 43.5v2M32 45.5q-3 3-6.5 1.2M32 45.5q3 3 6.5 1.2" stroke="#2b1607" stroke-width="1.4" fill="none" stroke-linecap="round"/>
 <ellipse class="t-mouth" cx="32" cy="48.6" rx="3" ry=".9" fill="#7a1b2a"/>
</svg>`;
document.querySelectorAll('[data-tiger]').forEach(el=>el.outerHTML=TIGER);
document.addEventListener('pointermove',e=>{
 for(const t of document.querySelectorAll('.tiger')){
  const r=t.getBoundingClientRect();if(!r.width)continue;
  const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160)*1.7;
  t.querySelector('.t-pupils').style.transform=`translate(${dx/d*k}px,${dy/d*k}px)`;
 }
},{passive:true});
chatPanel.addEventListener('click',e=>{const q=e.target.closest('[data-q]')?.dataset.q;if(q){askChat(q);$('#chat-input').focus()}});
chatToggle.addEventListener('click',()=>setChatOpen(chatPanel.hidden));
$('#chat-close').addEventListener('click',()=>setChatOpen(false));
$('#chat-form').addEventListener('submit',e=>{
 e.preventDefault();const input=$('#chat-input');const question=input.value.trim();if(!question)return;
 askChat(question);input.value='';input.focus();
});
app.addEventListener('click',e=>{const t=e.target.closest('button,img')||e.target;
 if(t.dataset.c){S.c=+t.dataset.c;S.u=0;view()}
 else if(t.dataset.u){S.u=+t.dataset.u;view()}
 else if(t.dataset.del){if(confirm('¿Eliminar este archivo?'))delImage(+t.dataset.del)}
 else if(t.dataset.big){$('#lb img').src=t.dataset.big;$('#lb').classList.add('on')}
 else if(t.dataset.next){$('#w'+t.dataset.next).scrollIntoView({behavior:'smooth'})}
 else if(t.dataset.lv){const s=getSkills();s[+t.dataset.sk].level=+t.dataset.lv;lsSet('skills',s);view()}
 else if(t.dataset.rs!==undefined){const s=getSkills();s.splice(+t.dataset.rs,1);lsSet('skills',s);view()}
 else if(t.id==='out'){sessionStorage.clear();history.replaceState(null,'',location.pathname);start(true)}});
app.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.slot){await addFiles(t.dataset.slot,t.files);t.value=''}
 else if(t.id==='pf'&&t.files[0]){
  try{const b=await shrink(t.files[0],600);await tx('kv','readwrite',s=>s.put(b,'photo'));if(S.photo)URL.revokeObjectURL(S.photo);S.photo=URL.createObjectURL(b);view()}
  catch(error){console.error('No se pudo guardar la foto de perfil',error);toast('No se pudo guardar la foto. Revisa el formato y el espacio disponible.')}
  finally{t.value=''}
 }});
app.addEventListener('submit',e=>{
 if(e.target.matches('.week-meta')){
  e.preventDefault();const form=e.target;const title=form.elements.namedItem('title').value.trim();const link=form.elements.namedItem('link').value.trim();
  if(link&&!safeLink(link))return toast('El enlace debe comenzar con http:// o https://');
  const details={...S.weekDetails};
  if(title||link)details[form.dataset.slot]={title,link};
  else delete details[form.dataset.slot];
  try{localStorage.setItem('weekDetails',JSON.stringify(details))}
  catch(error){console.error('No se pudieron guardar los datos de la semana',error);return toast('No se pudieron guardar los datos de la semana')}
  S.weekDetails=details;view();toast('Semana guardada');
 }else if(e.target.id==='pubf'){
  e.preventDefault();const btn=e.target.querySelector('button');const token=$('#ght').value.trim();if(!token)return;
  if(!S.imgs.length&&!Object.keys(S.weekDetails).length&&!confirm('Este navegador no tiene trabajos guardados. Si publicas, el link quedará sin trabajos. ¿Continuar?'))return;
  lsSet('ghToken',token);btn.disabled=true;btn.textContent='Publicando…';
  publish(token).catch(error=>{console.error('No se pudo publicar',error);toast(`No se pudo publicar: ${error.message}`,8000)})
   .finally(()=>{btn.disabled=false;btn.textContent='Publicar'});
 }else if(e.target.id==='sf'){
  e.preventDefault();const v=$('#sk').value.trim();if(!v)return;
  const s=getSkills();if(s.some(x=>x.name.toLocaleLowerCase()===v.toLocaleLowerCase()))return toast('Esa habilidad ya está en la lista');
  s.push({name:v,cat:$('#skc').value,level:+$('#skl').value});lsSet('skills',s);view();toast('Habilidad agregada');
 }
});
['dragover','dragleave','drop'].forEach(ev=>app.addEventListener(ev,e=>{const d=e.target.closest('.drop');if(!d)return;e.preventDefault();
 d.classList.toggle('over',ev==='dragover');if(ev==='drop')addFiles(d.dataset.slot,e.dataTransfer.files)}));
/* ---------- Efecto 3D ---------- */
const canTilt=matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');
let tiltCard=null;
const pointerIn=(e,el)=>{const r=el.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
function resetTilt(){
 if(tiltCard){tiltCard.style.transform='';tiltCard.classList.remove('tilting');tiltCard=null}
}
app.addEventListener('pointermove',e=>{
 if(!canTilt.matches)return;
 const box=$('.ph .box'),hero=e.target.closest('.hero');
 if(box)box.style.transform=hero?(([x,y])=>`rotateX(${(.5-y)*16}deg) rotateY(${(x-.5)*20}deg)`)(pointerIn(e,hero)):'';
 const card=e.target.closest('.tilt');
 if(card!==tiltCard)resetTilt();
 if(!card)return;
 const [x,y]=pointerIn(e,card);
 tiltCard=card;card.classList.add('tilting');
 card.style.setProperty('--mx',`${x*100}%`);card.style.setProperty('--my',`${y*100}%`);
 card.style.transform=`perspective(1000px) rotateX(${(.5-y)*6}deg) rotateY(${(x-.5)*8}deg) translateY(-4px)`;
});
app.addEventListener('pointerleave',()=>{resetTilt();const box=$('.ph .box');if(box)box.style.transform=''});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#lb').classList.remove('on');if(!chatPanel.hidden)setChatOpen(false)}});

async function start(publicMode=false){await load(publicMode);view(publicMode);if(!S.pub)backfillText()}
const adminRequested=new URLSearchParams(location.search).has('admin');
if(adminRequested){sessionStorage.getItem('ok')?start(false):authView()}else start(true);
</script>
